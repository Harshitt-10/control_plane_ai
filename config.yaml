# Top-level strictness policy configuration for ControlPlane.
# Each use case defines how aggressively the gateway should respond
# to tier-level findings.

version: 1

use_cases:
  customer_support_chatbot:
    strictness: medium
    thresholds:
      heuristics: 0.65
      rag: 0.55
      judge: 0.50
    actions:
      pass: allow
      review: flag
      critical: block

  internal_knowledge_assistant:
    strictness: high
    thresholds:
      heuristics: 0.75
      rag: 0.65
      judge: 0.60
    actions:
      pass: allow
      review: flag
      critical: block

  decision_support_regulated:
    strictness: strict
    thresholds:
      heuristics: 0.90
      rag: 0.80
      judge: 0.75
    actions:
      pass: allow
      review: flag
      critical: block
